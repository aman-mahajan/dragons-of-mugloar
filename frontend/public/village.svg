<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecfff"/>
      <stop offset=".4" stop-color="#c5e9ff"/>
      <stop offset=".72" stop-color="#e7f6c8"/>
      <stop offset="1" stop-color="#d5e6c8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".7" cy=".12" r=".35">
      <stop offset="0" stop-color="#ffe566" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe566" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerWash" cx=".5" cy=".42" r=".42">
      <stop offset="0" stop-color="#f7f1e1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f7f1e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d29a"/>
      <stop offset="1" stop-color="#d4b56a"/>
    </linearGradient>

    <g id="cloud">
      <ellipse cx="40" cy="22" rx="40" ry="16" fill="#fff" opacity=".85"/>
      <ellipse cx="18" cy="22" rx="18" ry="12" fill="#fff" opacity=".85"/>
      <ellipse cx="62" cy="20" rx="20" ry="13" fill="#fff" opacity=".85"/>
    </g>

    <g id="pine">
      <rect x="-5" y="38" width="10" height="28" fill="#6b4226"/>
      <polygon points="0,-8 -28,22 28,22" fill="#2f7a3a"/>
      <polygon points="0,6 -24,36 24,36" fill="#348644"/>
      <polygon points="0,20 -20,48 20,48" fill="#277038"/>
    </g>

    <g id="roundTree">
      <rect x="-6" y="42" width="12" height="36" rx="2" fill="#6b4226"/>
      <circle cy="20" r="28" fill="#3b9250"/>
      <circle cx="-16" cy="30" r="16" fill="#2f7a3a"/>
      <circle cx="16" cy="32" r="15" fill="#348644"/>
      <circle cx="4" cy="8" r="12" fill="#4e9a58"/>
    </g>

    <g id="cottage">
      <rect x="6" y="36" width="88" height="52" fill="#f7f1e1" stroke="#5a3316" stroke-width="3"/>
      <rect x="6" y="36" width="88" height="8" fill="#d5e6c8"/>
      <rect x="48" y="36" width="4" height="52" fill="#7a4a24"/>
      <polygon points="0,38 50,-6 100,38" fill="#c45c3a" stroke="#5a3316" stroke-width="3"/>
      <rect x="40" y="56" width="20" height="32" fill="#6b4226"/>
      <rect x="16" y="48" width="16" height="14" fill="#8ec8e8" stroke="#5a3316" stroke-width="1.5"/>
      <rect x="68" y="48" width="16" height="14" fill="#8ec8e8" stroke="#5a3316" stroke-width="1.5"/>
      <rect x="72" y="8" width="10" height="18" fill="#8a8a8a" stroke="#5a3316" stroke-width="2"/>
    </g>

    <g id="tavern">
      <rect x="8" y="40" width="120" height="70" fill="#f3e6c4" stroke="#5a3316" stroke-width="3"/>
      <rect x="8" y="40" width="120" height="10" fill="#d5e6c8"/>
      <rect x="44" y="40" width="5" height="70" fill="#7a4a24"/>
      <rect x="88" y="40" width="5" height="70" fill="#7a4a24"/>
      <polygon points="0,42 68,-14 136,42" fill="#a84a32" stroke="#5a3316" stroke-width="3"/>
      <rect x="54" y="68" width="28" height="42" fill="#6b4226"/>
      <circle cx="76" cy="90" r="3" fill="#e8b423"/>
      <rect x="18" y="56" width="18" height="16" fill="#8ec8e8" stroke="#5a3316" stroke-width="1.5"/>
      <rect x="100" y="56" width="18" height="16" fill="#8ec8e8" stroke="#5a3316" stroke-width="1.5"/>
      <rect x="18" y="82" width="18" height="16" fill="#8ec8e8" stroke="#5a3316" stroke-width="1.5"/>
      <rect x="100" y="82" width="18" height="16" fill="#8ec8e8" stroke="#5a3316" stroke-width="1.5"/>
      <rect x="58" y="18" width="36" height="16" rx="2" fill="#f7f1e1" stroke="#5a3316" stroke-width="2"/>
      <text x="76" y="30" text-anchor="middle" font-size="9" font-family="Georgia, serif" fill="#2f5a36">TAVERN</text>
    </g>

    <g id="well">
      <ellipse cx="18" cy="28" rx="18" ry="8" fill="#6a7a6a" stroke="#5a3316" stroke-width="2"/>
      <rect x="2" y="16" width="32" height="12" fill="#c5c8c2" stroke="#5a3316" stroke-width="2"/>
      <path d="M6 16 Q18 2 30 16" fill="none" stroke="#6b4226" stroke-width="3"/>
      <rect x="16" y="4" width="4" height="14" fill="#6b4226"/>
    </g>

    <g id="dragon">
      <ellipse cx="24" cy="18" rx="18" ry="10" fill="#4e7f52"/>
      <ellipse cx="6" cy="14" rx="10" ry="7" fill="#3b9250"/>
      <polygon points="36,14 52,6 40,20" fill="#2f7a3a"/>
      <polygon points="36,20 50,28 38,24" fill="#2f7a3a"/>
      <circle cx="2" cy="12" r="2" fill="#f7f1e1"/>
      <path d="M0 18 Q-10 28 -4 32" fill="none" stroke="#2f5a36" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="108" r="54" fill="#ffe566"/>
  <circle cx="1180" cy="108" r="78" fill="#fff3a0" opacity=".35"/>

  <use href="#cloud" x="180" y="70"/>
  <use href="#cloud" x="420" y="40" transform="scale(1.3)"/>
  <use href="#cloud" x="980" y="80"/>
  <use href="#cloud" x="1320" y="50" transform="scale(.9)"/>

  <!-- distant hills -->
  <ellipse cx="220" cy="430" rx="340" ry="170" fill="#7dbe62"/>
  <ellipse cx="620" cy="400" rx="300" ry="150" fill="#6fb35a"/>
  <ellipse cx="1000" cy="415" rx="340" ry="165" fill="#81c46a"/>
  <ellipse cx="1380" cy="400" rx="280" ry="155" fill="#6aae52"/>

  <use href="#dragon" x="1080" y="300" transform="scale(1.4)"/>

  <!-- far pines on ridges -->
  <g opacity=".85">
    <use href="#pine" x="80" y="300" transform="scale(.7)"/>
    <use href="#pine" x="140" y="310" transform="scale(.85)"/>
    <use href="#pine" x="210" y="295" transform="scale(.6)"/>
    <use href="#pine" x="520" y="280" transform="scale(.55)"/>
    <use href="#pine" x="900" y="285" transform="scale(.65)"/>
    <use href="#pine" x="1280" y="290" transform="scale(.7)"/>
    <use href="#pine" x="1360" y="305" transform="scale(.9)"/>
    <use href="#pine" x="1460" y="300" transform="scale(.6)"/>
  </g>

  <!-- meadow -->
  <ellipse cx="800" cy="820" rx="1000" ry="300" fill="#5a9a45"/>
  <ellipse cx="200" cy="870" rx="560" ry="230" fill="#4e8c3c"/>
  <ellipse cx="1400" cy="880" rx="580" ry="240" fill="#4c8a3a"/>
  <ellipse cx="800" cy="960" rx="900" ry="200" fill="#3f7a32"/>

  <!-- path -->
  <path d="M690 900 C710 760, 760 640, 800 560 C840 640, 890 760, 920 900" fill="url(#path)"/>
  <path d="M760 900 C775 780, 790 680, 800 600 C810 680, 830 780, 850 900" fill="#efe0b0" opacity=".45"/>

  <!-- village cluster -->
  <use href="#cottage" x="430" y="500" transform="scale(1.05)"/>
  <use href="#tavern" x="730" y="478"/>
  <use href="#cottage" x="980" y="508" transform="scale(.95)"/>
  <use href="#cottage" x="250" y="545" transform="scale(.85)"/>
  <use href="#well" x="660" y="575"/>

  <!-- fence -->
  <g stroke="#6b4226" stroke-width="3" fill="none">
    <path d="M200 640 L420 620"/>
    <path d="M1120 630 L1380 650"/>
  </g>
  <g fill="#6b4226">
    <rect x="210" y="618" width="5" height="22"/>
    <rect x="270" y="614" width="5" height="22"/>
    <rect x="330" y="610" width="5" height="22"/>
    <rect x="390" y="606" width="5" height="22"/>
    <rect x="1140" y="618" width="5" height="22"/>
    <rect x="1210" y="622" width="5" height="22"/>
    <rect x="1280" y="628" width="5" height="22"/>
    <rect x="1350" y="634" width="5" height="22"/>
  </g>

  <!-- side forest, frames the UI -->
  <use href="#roundTree" x="90" y="520" transform="scale(1.6)"/>
  <use href="#pine" x="40" y="560" transform="scale(1.5)"/>
  <use href="#roundTree" x="200" y="600" transform="scale(1.15)"/>
  <use href="#pine" x="160" y="640"/>
  <use href="#roundTree" x="70" y="680"/>

  <use href="#roundTree" x="1510" y="510" transform="scale(1.7)"/>
  <use href="#pine" x="1560" y="540" transform="scale(1.4)"/>
  <use href="#roundTree" x="1400" y="590" transform="scale(1.2)"/>
  <use href="#pine" x="1460" y="640"/>
  <use href="#roundTree" x="1540" y="670"/>

  <!-- foreground grass -->
  <g fill="#2d6b30" opacity=".65">
    <ellipse cx="90" cy="860" rx="70" ry="16"/>
    <ellipse cx="220" cy="885" rx="80" ry="18"/>
    <ellipse cx="1380" cy="875" rx="90" ry="18"/>
    <ellipse cx="1510" cy="850" rx="60" ry="14"/>
  </g>

  <!-- keeps the middle a little quieter for the boards -->
  <rect width="1600" height="900" fill="url(#centerWash)"/>
</svg>
